version: 3
systemUnderTest:
  service:
    $ref: "#/components/services/webBff"
    runOptions:
      openapi:
        host: localhost
        port: 4000
dependencies:
  services:
    - service:
        $ref: "#/components/services/pricingService"
        runOptions:
          $ref: "#/components/runOptions/pricingServiceMock"
components:
  sources:
    localSpecs:
      filesystem:
        directory: specs
    pricingServiceRepo:
      git:
        url: https://github.com/specmatic-demo/pricing-api
  services:
    webBff:
      description: "Web BFF"
      definitions:
        - definition:
            source:
              $ref: "#/components/sources/localSpecs"
            specs:
              - spec:
                  path: "web_bff.yaml"
    pricingService:
      description: "Pricing Service dependency"
      definitions:
        - definition:
            source:
              $ref: "#/components/sources/pricingServiceRepo"
            specs:
              - spec:
                  path: "specs/pricing.yaml"
  runOptions:
    pricingServiceMock:
      openapi:
        type: mock
        port: 5104
        host: localhost
