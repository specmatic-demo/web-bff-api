version: 3
systemUnderTest:
  service:
    $ref: "#/components/services/webBffApi"
    runOptions:
      openapi:
        host: localhost
        port: 4000
dependencies:
  services:
    - service:
        $ref: "#/components/services/pricingApi"
        runOptions:
          $ref: "#/components/runOptions/pricingApiMock"
components:
  sources:
    localSpecs:
      filesystem:
        directory: specs
    pricingApiRepo:
      git:
        url: https://github.com/specmatic-demo/pricing-api
  services:
    webBffApi:
      description: "Web BFF"
      definitions:
        - definition:
            source:
              $ref: "#/components/sources/localSpecs"
            specs:
              - spec:
                  path: "web_bff.yaml"
    pricingApi:
      description: "Pricing API dependency"
      definitions:
        - definition:
            source:
              $ref: "#/components/sources/pricingApiRepo"
            specs:
              - spec:
                  path: "specs/pricing.yaml"
  runOptions:
    pricingApiMock:
      openapi:
        type: mock
        port: 5104
        host: localhost
