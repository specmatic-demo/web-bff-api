name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  detect-spec-changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      specs_changed: ${{ steps.changes.outputs.specs }}
    steps:
      - uses: actions/checkout@v5
      - name: Detect changes in specs folder
        if: github.event_name == 'push'
        uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            specs:
              - 'specs/**'

  central-contract-repo-report:
    needs: detect-spec-changes
    if: |
      github.event_name == 'workflow_dispatch' ||
      needs.detect-spec-changes.outputs.specs_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Save Specmatic license
        run: |
          mkdir -p ~/.specmatic
          echo "${{ secrets.PROVIDER_REPOS_DEMO_LICENSE_KEY }}" > ~/.specmatic/specmatic-license.txt
      - name: Run Specmatic Linter
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e SPECMATIC_LICENSE_PATH=/tmp/specmatic-license.txt \
            -v "${{ github.workspace }}:/usr/src/app" \
            -v "$HOME/.specmatic/specmatic-license.txt:/tmp/specmatic-license.txt:ro" \
            -w /usr/src/app \
            specmatic/enterprise \
            lint 'specs/*.yaml'
      - name: Validate examples
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e SPECMATIC_LICENSE_PATH=/tmp/specmatic-license.txt \
            -v "${{ github.workspace }}:/usr/src/app" \
            -v "$HOME/.specmatic/specmatic-license.txt:/tmp/specmatic-license.txt:ro" \
            -w /usr/src/app \
            specmatic/enterprise \
            examples validate --specs-dir=specs
      - name: Run backward compatibility check
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e SPECMATIC_LICENSE_PATH=/tmp/specmatic-license.txt \
            -v "${{ github.workspace }}:/usr/src/app" \
            -v "$HOME/.specmatic/specmatic-license.txt:/tmp/specmatic-license.txt:ro" \
            -w /usr/src/app \
            specmatic/enterprise \
            backward-compatibility-check --target-path=specs --base-branch=HEAD^
      - name: Upload backward compatibility report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: web-bff-api-backward-compatibility-report
          path: build/reports/specmatic/backward_compatibility/ctrf/*.json
          if-no-files-found: ignore
      - name: Generate central contract repo report
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e SPECMATIC_LICENSE_PATH=/tmp/specmatic-license.txt \
            -v "${{ github.workspace }}:/usr/src/app" \
            -v "$HOME/.specmatic/specmatic-license.txt:/tmp/specmatic-license.txt:ro" \
            -w /usr/src/app \
            --network=host \
            specmatic/enterprise \
            central-contract-repo-report
      - name: Publish to Insights
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e SPECMATIC_LICENSE_PATH=/tmp/specmatic-license.txt \
            -v "${{ github.workspace }}:/usr/src/app" \
            -v "$HOME/.specmatic/specmatic-license.txt:/tmp/specmatic-license.txt:ro" \
            -w /usr/src/app \
            --network=host \
            specmatic/enterprise \
            send-report \
            --branch-name=${{ github.ref_name }} \
            --repo-name='${{ github.event.repository.name }}' \
            --repo-id='${{ github.event.repository.id }}' \
            --repo-url='${{ github.event.repository.html_url }}'

  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Save Specmatic license
        run: |
          mkdir -p ~/.specmatic
          echo "${{ secrets.PROVIDER_REPOS_DEMO_LICENSE_KEY }}" > ~/.specmatic/specmatic-license.txt
      - name: Start Web BFF
        run: docker compose up -d --build
      - name: Start Pricing Mock
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e SPECMATIC_LICENSE_PATH=/tmp/specmatic-license.txt \
            --name web-bff-api-pricing-mock \
            -v "${{ github.workspace }}:/usr/src/app" \
            -v "$HOME/.specmatic/specmatic-license.txt:/tmp/specmatic-license.txt:ro" \
            -w /usr/src/app \
            --network=host \
            specmatic/enterprise \
            mock > pricing-mock.log 2>&1 &
          for attempt in {1..30}; do
            if curl --silent --fail http://localhost:5104/ >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
      - name: Run contract tests
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e SPECMATIC_LICENSE_PATH=/tmp/specmatic-license.txt \
            -v "${{ github.workspace }}:/usr/src/app" \
            -v "$HOME/.specmatic/specmatic-license.txt:/tmp/specmatic-license.txt:ro" \
            -w /usr/src/app \
            specmatic/enterprise \
            test
      - name: Stop Pricing Mock and Web BFF
        run: |
          docker stop web-bff-api-pricing-mock
          docker compose down
      - name: Publish Contract Test Report
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e SPECMATIC_LICENSE_PATH=/tmp/specmatic-license.txt \
            -v "${{ github.workspace }}:/usr/src/app" \
            -v "$HOME/.specmatic/specmatic-license.txt:/tmp/specmatic-license.txt:ro" \
            -w /usr/src/app \
            --network=host \
            specmatic/enterprise \
            send-report \
            --branch-name=${{ github.ref_name }} \
            --repo-name='${{ github.event.repository.name }}' \
            --repo-id='${{ github.event.repository.id }}' \
            --repo-url='${{ github.event.repository.html_url }}'
